services:

  # ── Base de données PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: les-eternels-db
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-eternels}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB:       ${POSTGRES_DB:-les_eternels}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eternels} -d ${POSTGRES_DB:-les_eternels}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application Next.js ────────────────────────────────────────────────────
  back:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: les-eternels-back
    environment:
      DATABASE_URL:           "postgresql://${POSTGRES_USER:-eternels}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-les_eternels}"
      NEXTAUTH_SECRET:        ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET requis}
      NEXTAUTH_URL:           ${NEXTAUTH_URL:-http://localhost}
      NEXT_PUBLIC_SITE_URL:   ${NEXT_PUBLIC_SITE_URL:-http://localhost}
      SMTP_HOST:              ${SMTP_HOST:-}
      SMTP_PORT:              ${SMTP_PORT:-587}
      SMTP_USER:              ${SMTP_USER:-}
      SMTP_PASS:              ${SMTP_PASS:-}
      SMTP_FROM:              ${SMTP_FROM:-}
      STRIPE_SECRET_KEY:      ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET:  ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Nginx (reverse proxy + TLS) ────────────────────────────────────────────
  front:
    image: nginx:1.27-alpine
    container_name: les-eternels-front
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN requis (ex: les-eternels.fr)}
    # Substitue __DOMAIN__ dans le template avant de démarrer Nginx
    command:
      - /bin/sh
      - -c
      - |
        envsubst '$${DOMAIN}' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    depends_on:
      - back
    restart: unless-stopped

  # ── Certbot (obtention + renouvellement automatique) ──────────────────────
  certbot:
    image: certbot/certbot
    container_name: les-eternels-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Tente un renouvellement toutes les 12h (Let's Encrypt renouvelle à <30j)
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
